<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Neo Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 36px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
        }

        .header img {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
            line-height: 1.5;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            width: 100%;
            -webkit-app-region: no-drag;
        }

        input:focus {
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        input::placeholder {
            color: #64748b;
        }

        .btn-activate {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            margin-top: 6px;
            -webkit-app-region: no-drag;
        }

        .btn-activate:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }

        .btn-activate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.4;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .alert-loading {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(147, 197, 253, 0.3);
            border-top-color: #93c5fd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-links {
            text-align: center;
            margin-top: 4px;
        }

        .footer-links a {
            color: #94a3b8;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s ease;
            -webkit-app-region: no-drag;
        }

        .footer-links a:hover {
            color: #3b82f6;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <img src="../../assets/icons/neo-browser-v2.png" alt="Neo Browser" onerror="this.style.display='none'">
            <h1>Activate Neo Browser</h1>
            <p>Enter the purchase email and activation code sent after you bought Neo Browser.</p>
        </div>

        <div id="statusAlert" class="alert"></div>

        <form id="activationForm" onsubmit="handleActivate(event)">
            <div class="form-group">
                <label for="email">Purchase Email</label>
                <input type="email" id="email" placeholder="buyer@example.com" required autocomplete="off">
            </div>

            <div class="form-group" style="margin-top: 12px;">
                <label for="activationCode">Activation Code</label>
                <input type="text" id="activationCode" placeholder="NEO-XXXXX-XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" required autocomplete="off">
            </div>

            <button type="submit" id="btnActivate" class="btn-activate" style="width: 100%; margin-top: 18px;">Activate Neo Browser</button>
        </form>

        <div class="footer-links">
            <a href="mailto:support@your-domain.com" id="supportLink">Need help? Contact support</a>
        </div>
    </div>

    <script>
        async function handleActivate(e) {
            e.preventDefault();

            const emailInput = document.getElementById('email');
            const codeInput = document.getElementById('activationCode');
            const alertBox = document.getElementById('statusAlert');
            const btn = document.getElementById('btnActivate');

            const email = emailInput.value.trim();
            const activationCode = codeInput.value.trim();

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('Please enter a valid email address.', 'error');
                return;
            }

            if (!activationCode) {
                showAlert('Please enter your activation code.', 'error');
                return;
            }

            // Show loading state
            btn.disabled = true;
            showAlert('<div class="spinner"></div> Verifying activation…', 'loading');

            try {
                let ipc = null;
                if (typeof window !== 'undefined' && typeof window.require === 'function') {
                    ipc = window.require('electron').ipcRenderer;
                }

                let response = null;
                if (ipc && ipc.invoke) {
                    response = await ipc.invoke('license-activate', { email, activationCode });
                } else {
                    // Fallback for direct browser preview
                    response = { success: true, message: 'Neo Browser is activated on this device.' };
                }

                if (response && response.success) {
                    showAlert('Neo Browser is activated on this device.', 'success');
                    setTimeout(() => {
                        window.location.href = './5vp9k98wqz3n.html';
                    }, 1200);
                } else {
                    btn.disabled = false;
                    const msg = (response && response.message) ? response.message : 'The email or activation code is invalid.';
                    showAlert(msg, 'error');
                }
            } catch (err) {
                btn.disabled = false;
                showAlert('We couldn’t reach the license server. Check your connection and try again.', 'error');
            }
        }

        function showAlert(msg, type) {
            const box = document.getElementById('statusAlert');
            box.className = 'alert alert-' + type;
            box.innerHTML = msg;
            box.style.display = 'block';
        }
    </script>
</body>
</html>
